name: proxybase-gui Release

on:
  push:
    tags:
      - "proxybase-gui-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- Desktop builds (unchanged) ----
  build-desktop:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14

    steps:
      - name: Checkout proxybase-gui
        uses: actions/checkout@v4

      - name: Checkout libproxybase
        uses: actions/checkout@v4
        with:
          repository: proxybasehq/libproxybase
          path: libproxybase

      - name: Link libproxybase (Unix)
        if: runner.os != 'Windows'
        run: ln -s "$PWD/libproxybase" "$GITHUB_WORKSPACE/../libproxybase"

      - name: Link libproxybase (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mklink /J ..\libproxybase libproxybase

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release bundles
        if: matrix.os != 'macos-14'
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build release bundles (macOS universal)
        if: matrix.os == 'macos-14'
        run: pnpm tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify versions are consistent
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "package.json=$PKG tauri.conf.json=$CONF Cargo.toml=$CARGO"
          [ "$PKG" = "$CONF" ] && [ "$PKG" = "$CARGO" ] || {
            echo "ERROR: version mismatch — refusing to build a release with mismatched versions" >&2
            exit 1
          }
      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in src-tauri/target/release/bundle src-tauri/target/universal-apple-darwin/release/bundle; do
            if [ -d "$dir" ]; then
              find "$dir" -type f \( \
                -name '*.dmg' -o \
                -name '*.app.tar.gz' -o \
                -name '*.msi' -o \
                -name '*.exe' -o \
                -name '*.deb' -o \
                -name '*.rpm' -o \
                -name '*.AppImage' -o \
                -name '*.tar.gz' -o \
                -name '*.zip' \
              \) -exec cp {} dist/ \;
              # Collect updater manifest + signatures
              find "$dir" -type f \( \
                -name 'latest.json' -o \
                -name '*.sig' \
              \) -exec cp {} dist/ \; 2>/dev/null || true
            fi
          done
          # Tauri v2 generates per-artifact .sig files, but this CLI version
          # does NOT emit latest.json in the bundle dir — the final manifest is
          # assembled in the publish job from these sigs.
          if ! ls dist/*.sig >/dev/null 2>&1; then
            echo "ERROR: no .sig files generated — updater artifacts incomplete." >&2
            exit 1
          fi
          echo "Artifacts collected:"
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  # ---- Android build ----
  build-android:
    name: Bundle (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proxybase-gui
        uses: actions/checkout@v4

      - name: Checkout libproxybase
        uses: actions/checkout@v4
        with:
          repository: proxybasehq/libproxybase
          path: libproxybase

      - name: Link libproxybase to expected workspace-relative path
        run: ln -s "$PWD/libproxybase" "$GITHUB_WORKSPACE/../libproxybase"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.11902837"

      - name: Add NDK toolchain to PATH
        run: echo "$ANDROID_HOME/ndk/27.0.11902837/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        run: pnpm tauri android build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837

      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > src-tauri/gen/android/release.jks.b64
          base64 -d src-tauri/gen/android/release.jks.b64 > src-tauri/gen/android/release.jks
          ${{ env.ANDROID_HOME }}/build-tools/36.0.0/apksigner sign \
            --ks src-tauri/gen/android/release.jks \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out src-tauri/gen/android/app/build/outputs/apk/universal/release/proxybase-android-signed.apk \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv src-tauri/gen/android/app/build/outputs/apk/universal/release/proxybase-android-signed.apk \
             src-tauri/gen/android/app/build/outputs/apk/universal/release/proxybase-android-v${{ steps.version.outputs.version }}.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/proxybase-android-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

  # ---- Publish all bundles ----
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-android]
    steps:
      - name: Download desktop & android artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundles-*

      - name: Build updater manifest (latest.json) and prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          # Version from the release tag (proxybase-gui-v0.1.56 -> 0.1.56),
          # falling back to the version embedded in an artifact filename.
          VERSION="${GITHUB_REF_NAME#proxybase-gui-v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            FIRST_ARTIFACT=$(find dist -type f ! -name '*.sig' | head -1)
            VERSION=$(basename "$FIRST_ARTIFACT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          fi
          [ -n "$VERSION" ] || { echo "ERROR: could not determine version" >&2; exit 1; }

          BASE_URL="https://github.com/proxybasehq/proxybase-gui/releases/download/${GITHUB_REF_NAME}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MERGED=$(mktemp)
          jq -n --arg v "$VERSION" --arg n "" --arg d "$PUB_DATE" \
            '{version:$v, notes:$n, pub_date:$d, platforms:{}}' > "$MERGED"

          add_platform() {
            local key="$1" file="$2" sig_file="$3"
            local sig_content
            sig_content=$(tr -d '\r\n' < "$sig_file")
            jq --arg key "$key" \
               --arg url "$BASE_URL/$(basename "$file")" \
               --arg sig "$sig_content" \
               '.platforms[$key] = {url: $url, signature: $sig}' "$MERGED" > tmp && mv tmp "$MERGED"
            echo "  $key -> $(basename "$file")"
          }

          # Build platform entries from the signature files (one per updater
          # artifact). Keys match tauri-plugin-updater's target strings:
          # linux-x86_64, windows-x86_64, darwin-x86_64, darwin-aarch64.
          echo "Mapping updater artifacts:"
          for sig in $(find dist -type f -name '*.sig' | sort); do
            artifact="${sig%.sig}"
            base="$(basename "$artifact")"
            case "$base" in
              *.AppImage)
                add_platform "linux-x86_64" "$artifact" "$sig" ;;
              *.msi|*x64-setup.exe|*-setup.exe)
                add_platform "windows-x86_64" "$artifact" "$sig" ;;
              *_aarch64.app.tar.gz)
                add_platform "darwin-aarch64" "$artifact" "$sig" ;;
              *_x64.app.tar.gz|*_x86_64.app.tar.gz)
                add_platform "darwin-x86_64" "$artifact" "$sig" ;;
              *.app.tar.gz)
                # Universal macOS build serves both architectures.
                add_platform "darwin-x86_64" "$artifact" "$sig"
                add_platform "darwin-aarch64" "$artifact" "$sig" ;;
              *)
                echo "  (skipping unknown updater artifact: $base)" ;;
            esac
          done

          PLATFORM_COUNT=$(jq '.platforms | length' "$MERGED")
          if [ "$PLATFORM_COUNT" -eq 0 ]; then
            echo "ERROR: no updater artifacts found — refusing to publish" >&2
            exit 1
          fi

          # Prepare flat directory for release assets
          mkdir -p release_assets
          find dist -type f -exec cp {} release_assets/ \;
          cp "$MERGED" release_assets/latest.json

          echo "Generated latest.json:"
          cat release_assets/latest.json

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release_assets
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sort > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*
          generate_release_notes: true
