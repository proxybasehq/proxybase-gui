name: proxybase-gui Release

on:
  push:
    tags:
      - "proxybase-gui-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- Desktop builds (unchanged) ----
  build-desktop:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14

    steps:
      - name: Checkout proxybase-gui
        uses: actions/checkout@v4

      - name: Checkout libproxybase
        uses: actions/checkout@v4
        with:
          repository: proxybasehq/libproxybase
          path: libproxybase

      - name: Link libproxybase (Unix)
        if: runner.os != 'Windows'
        run: ln -s "$PWD/libproxybase" "$GITHUB_WORKSPACE/../libproxybase"

      - name: Link libproxybase (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mklink /J ..\libproxybase libproxybase

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release bundles
        if: matrix.os != 'macos-14'
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build release bundles (macOS universal)
        if: matrix.os == 'macos-14'
        run: pnpm tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in src-tauri/target/release/bundle src-tauri/target/universal-apple-darwin/release/bundle; do
            if [ -d "$dir" ]; then
              find "$dir" -type f \( \
                -name '*.dmg' -o \
                -name '*.app.tar.gz' -o \
                -name '*.msi' -o \
                -name '*.exe' -o \
                -name '*.deb' -o \
                -name '*.rpm' -o \
                -name '*.AppImage' -o \
                -name '*.tar.gz' \
              \) -exec cp {} dist/ \;
              # Collect updater manifest + signatures
              find "$dir" -type f \( \
                -name 'latest.json' -o \
                -name '*.sig' \
              \) -exec cp {} dist/ \; 2>/dev/null || true
            fi
          done
          echo "Artifacts collected:"
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  # ---- Android build ----
  build-android:
    name: Bundle (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proxybase-gui
        uses: actions/checkout@v4

      - name: Checkout libproxybase
        uses: actions/checkout@v4
        with:
          repository: proxybasehq/libproxybase
          path: libproxybase

      - name: Link libproxybase to expected workspace-relative path
        run: ln -s "$PWD/libproxybase" "$GITHUB_WORKSPACE/../libproxybase"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.11902837"

      - name: Add NDK toolchain to PATH
        run: echo "$ANDROID_HOME/ndk/27.0.11902837/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        run: pnpm tauri android build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837

      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > src-tauri/gen/android/release.jks.b64
          base64 -d src-tauri/gen/android/release.jks.b64 > src-tauri/gen/android/release.jks
          ${{ env.ANDROID_HOME }}/build-tools/36.0.0/apksigner sign \
            --ks src-tauri/gen/android/release.jks \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out src-tauri/gen/android/app/build/outputs/apk/universal/release/proxybase-android-signed.apk \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv src-tauri/gen/android/app/build/outputs/apk/universal/release/proxybase-android-signed.apk \
             src-tauri/gen/android/app/build/outputs/apk/universal/release/proxybase-android-v${{ steps.version.outputs.version }}.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/proxybase-android-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

  # ---- Publish all bundles ----
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-android]
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundles-*
          merge-multiple: true

      - name: Merge updater manifests
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Each platform build produces its own latest.json with one platform.
          # Merge them into a single manifest for the updater.
          MERGED=$(mktemp)
          echo '{"version":"","notes":"","pub_date":"","platforms":{}}' > "$MERGED"

          for f in latest.json */latest.json; do
            [ -f "$f" ] || continue
            echo "Merging $f..."

            # Read version/notes/pub_date from first manifest that has them
            v=$(jq -r '.version // empty' "$f")
            n=$(jq -r '.notes // empty' "$f")
            d=$(jq -r '.pub_date // empty' "$f")
            [ -n "$v" ] && jq --arg v "$v" '.version = $v' "$MERGED" > tmp && mv tmp "$MERGED"
            [ -n "$n" ] && jq --arg n "$n" '.notes = $n' "$MERGED" > tmp && mv tmp "$MERGED"
            [ -n "$d" ] && jq --arg d "$d" '.pub_date = $d' "$MERGED" > tmp && mv tmp "$MERGED"

            # Merge platform entries
            platforms=$(jq -r '.platforms // {}' "$f")
            jq --argjson p "$platforms" '.platforms += $p' "$MERGED" > tmp && mv tmp "$MERGED"
          done

          cp "$MERGED" latest.json
          echo "Final latest.json:"
          cat latest.json

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sort > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
