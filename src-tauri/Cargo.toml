[package]
name = "proxybase-gui"
version = "0.1.62"
description = "ProxyBase desktop GUI built with Tauri"
authors = ["ProxyBase Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/proxybasehq/proxybase-gui"
homepage = "https://proxybase.xyz"
rust-version = "1.78"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "proxybase_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = "0.4"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
libproxybase = { path = "../../libproxybase" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
hex = "0.4"
dirs = "5"
anyhow = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "macros"] }
tokio-util = "0.7"
fast-socks5 = "1.0.0"
rand = "0.8"
rustls = "0.23"
webpki-roots = "0.26"
uuid = { version = "1.20.0", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = { version = "2.3.2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
